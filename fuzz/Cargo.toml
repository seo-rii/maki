[[bin]]
name = "witness_rpc"
path = "fuzz_targets/witness_rpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "witness_etcd"
path = "fuzz_targets/witness_etcd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_response"
path = "fuzz_targets/http_response.rs"
test = false
