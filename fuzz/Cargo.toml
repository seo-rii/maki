# Coverage-guided (libFuzzer) fuzz targets. Detached from the main workspace
# (the empty [workspace] table below) so it never affects `cargo build
# --workspace` and only builds under `cargo +nightly fuzz`.
#
# Run (Linux, nightly). The two format targets need inputs longer than
# libFuzzer's default limit of 4096 bytes: a superblock is a 4096-byte frame
# after the byte that selects the decoder.
#   cargo +nightly fuzz run format_decoders -- -max_len=8192 -max_total_time=60
#   cargo +nightly fuzz run format_records  -- -max_len=8192 -max_total_time=60
#   cargo +nightly fuzz run journal_scan    -- -max_total_time=60
#   cargo +nightly fuzz run config_parse    -- -max_total_time=60
#   cargo +nightly fuzz run endpoint_url    -- -max_total_time=60
#   cargo +nightly fuzz run probe_parsers   -- -max_total_time=60

[package]
name = "maki-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Every target's code: the stable suite runs it on the committed seeds.
maki-fuzz-harness = { path = "harness" }

[[bin]]
name = "format_decoders"
path = "fuzz_targets/format_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format_records"
path = "fuzz_targets/format_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_scan"
path = "fuzz_targets/journal_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "endpoint_url"
path = "fuzz_targets/endpoint_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "probe_parsers"
path = "fuzz_targets/probe_parsers.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

# Detach from the parent workspace. The harness below this directory is a
# member of that one.
[workspace]
exclude = ["harness"]
