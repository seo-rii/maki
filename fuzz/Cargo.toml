[[bin]]
name = "helper_sysfs"
path = "fuzz_targets/helper_sysfs.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

# The workspace's patches of the crates the fuzzed code uses, so that it is
# built as the workspace builds it: the vendored serde_json (which decodes
# the rollback manifest, the remote witness state, the witness's RPC frames,
# etcd's answers and the providers' JSON responses), bytes, hyper (the HTTP
# provider's client and the gRPC provider's transport), rustls (the
# witness's and the providers' TLS) and tungstenite (the WebSocket
# provider's frames), not their crates.io releases.
[patch.crates-io]
bytes = { path = "../vendor/bytes" }
hyper = { path = "../vendor/hyper" }
rustls = { path = "../vendor/rustls" }
serde_json = { path = "../vendor/serde_json" }
tungstenite = { path = "../vendor/tungstenite" }

# Detach from the parent workspace. The harness below this directory is a
# member of that one.
[workspace]
exclude = ["harness"]
