# Coverage-guided (libFuzzer) fuzz targets. Detached from the main workspace
# (the [workspace] table below) so it never affects `cargo build
# --workspace` and only builds under `cargo +nightly fuzz`. Each target is
# one line that calls its entry function in harness/ (maki-fuzz-harness, a
# member of the main workspace), whose suite replays every committed seed in
# seeds/<target>/ on the stable toolchain
# (harness/tests/review_fuzz_corpus.rs).
#
# Run (Linux, nightly) from the repository root. Cargo.lock is not
# committed here: start it from the workspace's, so the fuzzed code is
# built with the versions the workspace pins. A run reads the committed
# seeds and keeps what it finds in fuzz/corpus/<target>, which is not
# committed either; a crash's input goes to fuzz/artifacts/<target>.
#   cp Cargo.lock fuzz/Cargo.lock
#   cargo +nightly fuzz run <target> fuzz/corpus/<target> fuzz/seeds/<target> -- -max_total_time=60
# Add -max_len=8192 for format_decoders and format_records (a superblock is
# a 4096-byte frame after the byte that selects the decoder, longer than
# libFuzzer's default limit of 4096 bytes) and -max_len=70000 for
# nbd_handshake (beyond the client's 64 KiB byte limit). The fuzz job of
# .github/workflows/ci.yml runs every target so for 30 seconds.

[package]
name = "maki-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Exact, with libFuzzer's own dependency on `arbitrary`: fuzz/Cargo.lock is
# not committed, and the workspace's lockfile that the build starts from
# lists neither.
arbitrary = "=1.5.0"
libfuzzer-sys = "=0.4.13"
# Every target's code: the stable suite runs it on the committed seeds.
maki-fuzz-harness = { path = "harness" }

[[bin]]
name = "format_decoders"
path = "fuzz_targets/format_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format_records"
path = "fuzz_targets/format_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_scan"
path = "fuzz_targets/journal_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "endpoint_url"
path = "fuzz_targets/endpoint_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "probe_parsers"
path = "fuzz_targets/probe_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nbd_handshake"
path = "fuzz_targets/nbd_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nbd_netlink"
path = "fuzz_targets/nbd_netlink.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backing_records"
path = "fuzz_targets/backing_records.rs"
test = false
