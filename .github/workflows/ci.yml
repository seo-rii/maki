# CI strategy per SPEC §55.
# PR: fast, deterministic suites. Nightly: full property/crash/saturation
# gates. Weekly & release tiers (DB qualification, TLS suite, soak, QEMU
# power loss) require dedicated runners — see docs/testing.md.

name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *" # nightly gates

# A rollback fixture that finds no second filesystem for its witness prints
# that it is skipped and passes, and test runs do not show the output of
# passing tests. The runners have /dev/shm on a filesystem of its own, so
# here a missing one is a failure (tests/support/other_filesystem.rs). The
# same holds for the tests of the helper's NBD handshake against a real
# nbdkit and of its constants against the kernel's UAPI headers: every job
# that runs them installs nbdkit, the kernel's UAPI headers (linux-libc-dev,
# kernel-headers on EL9) and a C compiler. The Linux tests of the HTTP and
# gRPC transports' connect across address families need the IPv6 loopback
# address, which the runner VMs have; without it they would pass unseen.
env:
  MAKI_TEST_REQUIRE_OTHER_FILESYSTEM: "1"
  MAKI_TEST_REQUIRE_NBDKIT: "1"
  MAKI_TEST_REQUIRE_NBD_HEADERS: "1"
  MAKI_TEST_REQUIRE_IPV6: "1"

jobs:
  dependency-audit:
    # Keep the security gate independent so an advisory cannot hide test results.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: dependency-audit
      - name: install pinned RustSec auditor (Linux)
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: RustSec dependency audit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for lockfile in Cargo.lock vendor/*/Cargo.lock; do
            cargo audit --deny warnings --file "$lockfile"
          done

  systemd-lifecycle:
    # A disposable runner exercises the real manager and failed-start hook.
    # All resources are private marker files; no NBD/LVM/mount commands run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: systemd-lifecycle
      - name: fixture contracts
        run: python3 -B -m unittest scripts.test_systemd_lifecycle_validation -v
      - name: build the actual recovery hook
        run: cargo build --locked -p maki-attach
      - name: packaged systemd lifecycle
        run: |
          sudo python3 -B scripts/systemd-lifecycle-validation.py \
            --disposable-host --helper-binary "$PWD/target/debug/maki-attach" \
            --output "$RUNNER_TEMP/maki-systemd-fixture"
      - name: collect private fixture results
        if: always()
        run: |
          if sudo test -d "$RUNNER_TEMP/maki-systemd-fixture"; then
            sudo tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/maki-systemd-fixture.tar.gz" maki-systemd-fixture
            sudo chmod 0644 "$RUNNER_TEMP/maki-systemd-fixture.tar.gz"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systemd-lifecycle-results
          path: ${{ runner.temp }}/maki-systemd-fixture.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  pr:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Formatting does not depend on the platform. On Windows `cargo fmt
      # --all` passes every target's root file to one rustfmt command line,
      # which the workspace has outgrown ("The filename or extension is too
      # long", os error 206).
      - name: fmt (Linux)
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: native NBD test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nbdkit nbdkit-plugin-dev libnbd-bin dpkg-dev gcc linux-libc-dev rpm cpio
          nbdkit --version
          nbdinfo --version
          nbdcopy --version
          test -f /usr/include/nbdkit-plugin.h
          test -f /usr/include/linux/nbd-netlink.h
      # SPEC §55 PR tier: unit, property smoke, codec, fake crypto, journal
      # failpoint smoke, retry/manual-clock, privilege unit, NBD protocol
      # smoke — all part of the default workspace suite. `--locked` keeps
      # the build reproducible against Cargo.lock (third review).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: workspace tests
        run: python scripts/run_cargo_tests.py --workspace --locked
      # The helper's kernel NBD test connects a real /dev/nbdN. The runner's
      # kernel may ship the module only in linux-modules-extra; if neither
      # loads, this step fails, so CI says whether the runner has NBD.
      - name: load the NBD kernel module (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! sudo modprobe nbd; then
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe nbd
          fi
          test -d /sys/module/nbd
      # Tests that give a fixture to another user, run a binary as the
      # daemon user, enter a private mount namespace or connect a kernel
      # NBD device skip without root, and the run above is unprivileged. The
      # script reuses that compilation as the runner user and starts only
      # the listed test executables through sudo; without root it fails
      # instead of skipping. Only here does a missing NBD module fail.
      - name: root-only tests (Linux)
        if: runner.os == 'Linux'
        env:
          MAKI_TEST_REQUIRE_NBD: "1"
        run: python3 -B scripts/run_root_tests.py --open-build-tree --workspace --locked
      # A separate package invocation avoids workspace dev dependencies
      # supplying tonic's TLS backend and hiding missing production features.
      - name: standalone gRPC TLS provider selection (Linux)
        if: runner.os == 'Linux'
        run: cargo test --locked -p maki-crypto-grpc --features rustls/aws-lc-rs --test review_tls_handshake_deadline
      - name: pinned plaintext-erasure dependency contract (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -B -m unittest scripts.test_vendor_erasure -v
          python3 -B scripts/check_vendor_erasure.py
      - name: parser erasure and upstream compatibility (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features raw_value
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --release --features raw_value --test maki_raw
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,raw_value --lib
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features arbitrary_precision
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features raw_value,arbitrary_precision
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --release --features arbitrary_precision --test maki_number
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,arbitrary_precision --lib
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,raw_value,arbitrary_precision --lib
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features float_roundtrip
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features raw_value,float_roundtrip
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features arbitrary_precision,float_roundtrip
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features raw_value,arbitrary_precision,float_roundtrip
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --release --features raw_value,arbitrary_precision,float_roundtrip --test maki_float --test maki_raw --test maki_number --test maki_scratch
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,float_roundtrip --lib
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,raw_value,arbitrary_precision,float_roundtrip --lib
      - name: TLS erasure and upstream compatibility (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path vendor/rustls/Cargo.toml --target-dir target --locked --no-default-features --features std,ring,tls12 --lib
          cargo test --manifest-path vendor/rustls/Cargo.toml --target-dir target --locked --no-default-features --features std,aws_lc_rs,tls12 --lib
      - name: transport framing erasure and upstream compatibility (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path vendor/bytes/Cargo.toml --target-dir target --locked --features serde
          cargo test --manifest-path vendor/hyper/Cargo.toml --target-dir target --locked --features client,server,http1,http2 --lib
          cargo test --manifest-path vendor/tungstenite/Cargo.toml --target-dir target --locked
      - name: fault campaign oracles (Linux)
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s scripts -p 'test_*validation.py' -v
      - name: Debian package contract (Linux)
        if: runner.os == 'Linux'
        run: python3 -B -m unittest scripts.test_debian_package -v
      # Ubuntu's rpm builds the RPM from the same artifacts as the Debian
      # package, so here the two are also compared file by file.
      - name: RPM package contract (Linux)
        if: runner.os == 'Linux'
        env:
          MAKI_TEST_REQUIRE_DPKG_DEB: "1"
        run: python3 -B -m unittest scripts.test_rpm_package -v
      - name: release candidate preparation contract (Linux)
        if: runner.os == 'Linux'
        run: python3 -B -m unittest scripts.test_release_preparation -v
      - name: documentation links (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -B -m unittest scripts.test_docs_links -v
          python3 -B scripts/check_docs_links.py
      # Every suite above runs with -B. An interpreter that one of them
      # starts without it compiles scripts/*.py into the checkout.
      - name: Python suites leave no bytecode in the checkout (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e scripts/__pycache__ ]; then
            ls -l scripts/__pycache__ >&2
            exit 1
          fi

  latest-stable:
    # The baseline is reproducible; new stable warnings are checked separately.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: latest-stable
      - name: native NBD test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nbdkit nbdkit-plugin-dev libnbd-bin dpkg-dev gcc linux-libc-dev
      # Formatting does not depend on the platform. On Windows `cargo fmt
      # --all` passes every target's root file to one rustfmt command line,
      # which the workspace has outgrown ("The filename or extension is too
      # long", os error 206).
      - name: fmt (Linux)
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: workspace tests
        run: python scripts/run_cargo_tests.py --workspace --locked

  rhel9:
    # A RHEL 9 userspace: glibc 2.34, nbdkit 1.38 at /usr/sbin/nbdkit and its
    # plugin header, LVM2, systemd 252, rpm 4.16 and Python 3.9. CentOS Stream
    # 9 is the public upstream of RHEL 9 (Rocky and Alma rebuild RHEL; UBI
    # lacks nbdkit-devel and CRB). The tag follows the stream on purpose. The
    # kernel is the runner's and nothing attaches a device, so RHEL's kernel,
    # SELinux and the attach path are not covered here.
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    timeout-minutes: 60
    steps:
      # BaseOS and AppStream, plus CRB for nbdkit-devel (the ABI test's
      # header; the package itself does not need CRB). No EPEL. nbdkit-server
      # as the RPM requires it, not the nbdkit metapackage the guide warns
      # about; the basic plugins for the tests' memory and eval exports, and
      # the UAPI headers for the netlink constant probes. lvm2, xfsprogs and
      # kmod come with the RPM's own Requires in its step.
      - name: build and test dependencies
        run: |
          dnf install -y -q --enablerepo=crb --setopt=install_weak_deps=False \
            gcc git-core python3 rpm-build cpio diffutils findutils gzip tar procps-ng \
            nbdkit-server nbdkit-basic-plugins nbdkit-devel libnbd util-linux systemd kernel-headers
          nbdkit --version
          test "$(command -v nbdkit)" = /usr/sbin/nbdkit
          nbdinfo --version
          nbdcopy --version
          test -f /usr/include/nbdkit-plugin.h
          test -f /usr/include/linux/nbd.h
          test -f /usr/include/linux/nbd-netlink.h
      - uses: actions/checkout@v4
      # The steps run as root, but the workspace, RUNNER_TEMP and HOME belong
      # to the runner's uid 1001. actions/checkout trusts the workspace only
      # in a temporary git config, so root's git refuses it ("dubious
      # ownership"). Fixtures that need every ancestor of their directory to
      # be root's and closed to others (regression_mount_target.rs) refuse
      # the workspace, HOME and the world-writable /tmp, so the tests get a
      # root-owned TMPDIR below root-owned ancestors; 0755, as the root
      # runner's scratch directory, because fixtures hand files to uid 65534.
      - name: root in the runner-owned workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          install -d -o root -g root -m 0755 /var/lib/maki-ci-tmp
          echo "TMPDIR=/var/lib/maki-ci-tmp" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: rhel9
      - name: packaged binaries
        run: cargo build --release --locked -p maki -p maki-attach -p maki-check -p maki-nbdkit
      - name: nbdkit ABI against the EL9 header
        run: cargo test --locked -p maki-nbdkit --test review_abi -- --nocapture
      # The container runs as root, so the root-only targets of these crates
      # run here too; those that need a private mount namespace or a writable
      # cgroup tree, which the container lacks, print why they skip. The
      # Ubuntu job runs them as root on the same kernel. --no-fail-fast: one
      # failing test binary must not hide the others.
      - name: helper, attach and plugin suites
        run: python3 -B scripts/run_cargo_tests.py --locked --no-fail-fast -p maki-privileged -p maki-attach -p maki-nbdkit
      - name: RPM package contract
        run: python3 -B -m unittest scripts.test_rpm_package -v
      - name: build, install and remove the RPM
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/maki.rpm"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            python3 -B packaging/rpm/build-rpm.py --release-dir target/release \
            --version 0.0.0~ci --architecture "$(rpm --eval '%{_arch}')" --output "$package"
          rpm -qp --requires "$package" | tee "$RUNNER_TEMP/requires"
          # The owner of the binaries' loader, and libraries of EL9's glibc.
          grep -qx glibc "$RUNNER_TEMP/requires"
          grep -q '^libc\.so\.6(GLIBC_2\.34)(64bit)$' "$RUNNER_TEMP/requires"
          # The user and groups of the sysusers file, each provided once. The
          # spec declares them: rpm's sysusers generator comes with
          # systemd-rpm-macros, which the release workflow's container lacks.
          rpm -qp --provides "$package" | tee "$RUNNER_TEMP/provides"
          for provided in 'user(maki)' 'group(maki)' 'group(maki-admin)'; do
            test "$(grep -cxF "$provided" "$RUNNER_TEMP/provides")" = 1
          done
          dnf install -y -q "$package"
          # Its Requires brought the runtime, without the nbdkit metapackage.
          rpm -q nbdkit-server lvm2 xfsprogs util-linux systemd kmod
          for unwanted in nbdkit nbdkit-selinux; do
            if rpm -q "$unwanted"; then exit 1; fi
          done
          # It conflicts with nbdkit-selinux: dnf refuses to add the module.
          if dnf install --assumeno nbdkit-selinux > "$RUNNER_TEMP/selinux" 2>&1; then exit 1; fi
          grep -q 'conflicts with nbdkit-selinux' "$RUNNER_TEMP/selinux"
          rpm -V maki
          getent passwd maki
          getent group maki-admin
          test "$(stat -c '%U:%G %a' /run/maki-attach /etc/maki/attach)" = "$(printf 'root:root 700\nroot:root 700')"
          grep -qx 'ExecStart=/usr/sbin/nbdkit \\' /usr/lib/systemd/system/maki@.service
          systemd-analyze verify maki@ci.service maki-attach@ci.service \
            maki-recover@ci.service maki-workload@ci.target
          # rpm cannot stop a transaction from %preun: under an attachment
          # `dnf remove maki` used to keep Maki and erase nbdkit-server, lvm2,
          # xfsprogs and kmod as unused dependencies. The package's entry in
          # /etc/dnf/protected.d makes dnf refuse, before it changes anything,
          # to remove Maki or what it requires, and to install the nbdkit
          # metapackage in its place. Reinstalling is not refused.
          echo '{}' > /run/maki-attach/ci.nbd
          if dnf remove -y maki > "$RUNNER_TEMP/remove" 2>&1; then exit 1; fi
          grep -q 'removing the following protected packages: maki' "$RUNNER_TEMP/remove"
          if dnf remove -y lvm2 > "$RUNNER_TEMP/remove-lvm2" 2>&1; then exit 1; fi
          grep -q 'broken dependencies for the following protected packages: maki' "$RUNNER_TEMP/remove-lvm2"
          if dnf install -y --allowerasing nbdkit > "$RUNNER_TEMP/metapackage" 2>&1; then exit 1; fi
          grep -q 'conflicts with nbdkit provided by' "$RUNNER_TEMP/metapackage"
          dnf reinstall -y -q "$package"
          rpm -q maki nbdkit-server lvm2 xfsprogs kmod
          for unwanted in nbdkit nbdkit-selinux; do
            if rpm -q "$unwanted"; then exit 1; fi
          done
          rpm -V maki
          # rpm -e is how the package is removed, and %preun still refuses it
          # under an attachment record.
          if rpm -e maki; then
            echo "the package was removed under an attachment record" >&2; exit 1
          fi
          rpm -q maki
          rm /run/maki-attach/ci.nbd
          if dnf remove -y maki > "$RUNNER_TEMP/remove-idle" 2>&1; then exit 1; fi
          rpm -e maki
          if rpm -q maki; then exit 1; fi
          test ! -e /etc/dnf/protected.d/maki.conf

  kernel-lifecycle:
    # A whole attachment on the runner's own kernel. GitHub's Ubuntu runners
    # are VMs with systemd as PID 1, udev and passwordless sudo, and load the
    # nbd module. The privileged runner (scripts/privileged-linux-validation.sh,
    # its runbook in docs/qualification) builds maki, maki-attach and Maki's
    # nbdkit plugin from this commit and drives them through kernel NBD, LVM,
    # device-mapper and XFS: attach, data written and fsynced, a detach whose
    # disconnect finds the device still held open (the wait of AUD-197), a
    # second attach that reads the data back, a cleanup after nbdkit is
    # killed under the mount, a third attach and a final detach. The package
    # built from the same commit then runs the Debian guide's install steps,
    # the quick start and its first-volume bootstrap (AUD-199) as written,
    # under systemd with the installed units. The runner is Ubuntu, not the
    # Debian 12 primary platform.
    runs-on: ubuntu-latest
    # Above the sum of the step limits and the build, so that a hung step
    # fails by its own limit and the diagnostics still run.
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-lifecycle
      - name: runner host
        run: |
          uname -a
          cat /etc/os-release
          systemctl --version | head -n 1
          echo "system state: $(systemctl is-system-running || true)"
          systemctl --failed --no-pager || true
          sudo --version | head -n 1
          nproc
          free -m
          df -h / /var/tmp /var/lib "$RUNNER_TEMP"
          id
      # With the parameters the privileged runner asks for, so that its own
      # modprobe finds the module loaded as it wants it. The kernel may ship
      # the module only in linux-modules-extra; if neither loads, this fails.
      - name: load the NBD module
        run: |
          if ! sudo modprobe nbd nbds_max=16 max_part=8; then
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe nbd nbds_max=16 max_part=8
          fi
          test -d /sys/module/nbd
          test -b /dev/nbd0
          test -b /dev/nbd15
          echo "nbds_max=$(cat /sys/module/nbd/parameters/nbds_max) max_part=$(cat /sys/module/nbd/parameters/max_part)"
      # As the runner user, which has passwordless sudo: the script refuses
      # root and calls sudo only where it needs it. It installs its tools
      # with apt, builds from a snapshot of this commit, and prints each
      # check; its logs stay in ~/logs/maki-privileged-validation.latest.
      - name: attach lifecycle through the privileged runner
        timeout-minutes: 45
        run: |
          scripts/privileged-linux-validation.sh --install-missing --kill-daemon \
            --device /dev/nbd15 --confirm-wipe /dev/nbd15
      # The package's tmpfiles make /run/maki root:maki 0750, which the
      # runner's own nbdkit could not pass, so it is installed only now.
      - name: packaged binaries
        if: ${{ !cancelled() }}
        run: cargo build --release --locked -p maki -p maki-attach -p maki-check -p maki-nbdkit
      - name: documented quick start on the installed package
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dpkg-dev psmisc
          workdir="$RUNNER_TEMP/quickstart"
          python3 -B scripts/documented_quickstart.py "$workdir"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            python3 -B packaging/debian/build-deb.py --release-dir target/release \
            --version 0.0.0~ci --architecture "$(dpkg --print-architecture)" \
            --output "$workdir/maki.deb"
          dpkg-deb --field "$workdir/maki.deb" Depends
          cd "$workdir"
          # The guides' blocks, in order, in one root shell: it stops at the
          # first failed command and names the step.
          sudo bash quickstart.sh 2>&1 | tee quickstart.log
          # The quick start's clean-up leaves no attachment behind.
          sudo test ! -e /run/maki-attach/demo.nbd
          if findmnt /srv/demo; then exit 1; fi
          for unit in maki@demo.service maki-attach@demo.service maki-recover@demo.service \
            maki-workload@demo.target; do
            test "$(systemctl show -P ActiveState "$unit")" = inactive
          done
          for attribute in /sys/block/nbd*/backend; do
            if [ -e "$attribute" ] && [ -n "$(cat "$attribute")" ]; then
              echo "$attribute shows a connection: $(cat "$attribute")" >&2
              exit 1
            fi
          done
      - name: diagnostics on failure
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        run: |
          set +e
          latest="$HOME/logs/maki-privileged-validation.latest"
          echo "::group::privileged runner status and component logs"
          cat "$latest/status"
          for file in "$latest"/*.txt "$latest"/*.log; do
            [ -f "$file" ] || continue
            echo "===== ${file##*/} (last 80 lines)"
            tail -n 80 "$file"
          done
          echo "::endgroup::"
          echo "::group::kernel log (last 300 lines)"
          sudo dmesg | tail -n 300
          echo "::endgroup::"
          echo "::group::maki units"
          systemctl --no-pager --all list-units 'maki*'
          sudo journalctl -b --no-pager -o short-monotonic -u 'maki*' | tail -n 300
          echo "::endgroup::"
          echo "::group::NBD devices, mappings, mounts and attach records"
          lsblk -o NAME,MAJ:MIN,SIZE,TYPE,MOUNTPOINTS
          for device in /sys/block/nbd*; do
            echo "${device##*/} pid=$(cat "$device/pid" 2>/dev/null) backend=$(cat "$device/backend" 2>/dev/null) holders=$(ls "$device/holders" 2>/dev/null | tr '\n' ' ')"
          done
          sudo timeout 30 dmsetup info -c
          sudo timeout 30 vgs
          sudo timeout 30 lvs
          findmnt -t xfs
          sudo ls -la /run/maki-attach
          sudo sh -c 'for record in /run/maki-attach/*.nbd; do [ -e "$record" ] && { echo "== $record"; cat "$record"; echo; }; done'
          sudo fuser -v /dev/nbd* 2>&1
          ps -eo pid,user,stat,wchan:32,args | grep -E 'nbdkit|maki|umount|vgchange|dmsetup|udev' | grep -v grep
          echo "::endgroup::"
      # The run directory without its source snapshot and build trees, the
      # quick start's program and output without the package, and the
      # journal. The key files (the runner's in its work tree, the quick
      # start's in /etc/maki/secrets) are never collected.
      - name: collect logs
        if: always()
        run: |
          set +e
          out="$RUNNER_TEMP/kernel-lifecycle-logs"
          mkdir -p "$out"
          latest="$HOME/logs/maki-privileged-validation.latest"
          if [ -d "$latest" ]; then
            tar -C "$latest/" --exclude=./source --exclude=./target --exclude=./build \
              -czf "$out/privileged-run.tar.gz" .
          fi
          if [ -d "$RUNNER_TEMP/quickstart" ]; then
            tar -C "$RUNNER_TEMP/quickstart" --exclude=./maki.deb -czf "$out/quickstart.tar.gz" .
          fi
          sudo journalctl -b --no-pager -o short-monotonic -k > "$out/kernel.log"
          sudo journalctl -b --no-pager -o short-monotonic -u 'maki*' > "$out/maki-units.log"
          sudo journalctl -b --no-pager -o short-monotonic -u systemd-udevd > "$out/udev.log"
          # LVM prints its driver's version only as root, and warns about the
          # descriptors this shell passes on unless told not to.
          for command in 'uname -srvm' 'nbdkit --version' 'nbdinfo --version' \
            'sudo env LVM_SUPPRESS_FD_WARNINGS=1 lvm version' 'mkfs.xfs -V' 'udevadm --version' \
            'systemctl --version' 'sudo --version' 'python3 --version'; do
            echo "\$ $command"
            $command 2>&1 | head -n 3
          done > "$out/versions.txt"
          cat "$out/versions.txt"
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-lifecycle-logs
          path: ${{ runner.temp }}/kernel-lifecycle-logs
          if-no-files-found: ignore
          retention-days: 7

  debian12-package:
    # The package the Debian 12 guests install, built from this commit in a
    # debian:12 container as the release workflow builds it: against
    # bookworm's glibc, with dpkg-shlibdeps adding the native libraries to
    # Depends. The Ubuntu runner's glibc is newer than bookworm's.
    runs-on: ubuntu-latest
    container: debian:12
    # Above the sum of the step limits.
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - name: build dependencies
        timeout-minutes: 10
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            build-essential dpkg-dev python3 git curl ca-certificates
      - uses: actions/checkout@v4
        timeout-minutes: 5
      # The steps run as root in a workspace that belongs to the runner's uid
      # 1001: root's git refuses it unless it is a safe directory.
      - name: root in the runner-owned workspace
        timeout-minutes: 1
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@1.94.0
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          key: debian12-package
      - name: packaged binaries
        timeout-minutes: 40
        run: cargo build --release --locked -p maki -p maki-attach -p maki-check -p maki-nbdkit
      - name: guest package
        timeout-minutes: 5
        run: |
          mkdir dist
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            python3 -B packaging/debian/build-deb.py --release-dir target/release \
            --version 0.0.0~ci --architecture "$(dpkg --print-architecture)" --output dist/maki.deb
          dpkg-deb --info dist/maki.deb
          git rev-parse --verify 'HEAD^{commit}' > dist/source-revision
          (cd dist && sha256sum maki.deb source-revision | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        with:
          name: debian12-package
          path: dist
          if-no-files-found: error
          retention-days: 7

  el9-package:
    # The RPM the EL9 guests install, built from this commit in the CentOS
    # Stream 9 container the release workflow builds the published RPM in:
    # against glibc 2.34, with rpm's library requirements.
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    # Above the sum of the step limits.
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - name: build dependencies
        timeout-minutes: 10
        run: |
          dnf install -y -q --setopt=install_weak_deps=False \
            gcc git-core python3 rpm-build cpio diffutils findutils gzip tar
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: root in the runner-owned workspace
        timeout-minutes: 1
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@1.94.0
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          key: el9-package
      - name: packaged binaries
        timeout-minutes: 40
        run: cargo build --release --locked -p maki -p maki-attach -p maki-check -p maki-nbdkit
      - name: guest package
        timeout-minutes: 5
        run: |
          mkdir dist
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            python3 -B packaging/rpm/build-rpm.py --release-dir target/release \
            --version 0.0.0~ci --architecture "$(rpm --eval '%{_arch}')" --output dist/maki.rpm
          rpm -qip dist/maki.rpm
          rpm -qp --requires dist/maki.rpm
          git rev-parse --verify 'HEAD^{commit}' > dist/source-revision
          (cd dist && sha256sum maki.rpm source-revision | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        with:
          name: el9-package
          path: dist
          if-no-files-found: error
          retention-days: 7

  debian12-guest:
    # A booted Debian 12 host: Debian's generic cloud image (its standard
    # kernel), pinned by name and digest, under QEMU with KVM on the runner,
    # set up by cloud-init (scripts/booted-host-validation.py). It is a KVM
    # virtual machine on GitHub's hardware, not a bare-metal host. Each suite
    # gets a fresh guest. guides: the Debian guide's install steps, the quick
    # start and the first-volume bootstrap, written by
    # documented_quickstart.py, run as root with the package from this
    # commit. runner: the privileged runner's lifecycle (--kill-daemon) on
    # /dev/nbd15, with the binaries taken from that package. Every step of
    # the guest runs scripts/booted-host-guest.py under a time limit.
    needs: debian12-package
    runs-on: ubuntu-latest
    # Above the sum of the step limits, so that a hung step fails by its own
    # limit and the logs are still collected.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        suite: [guides, runner]
    defaults:
      run:
        shell: bash
    env:
      GUEST: debian12
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: runner host
        timeout-minutes: 2
        run: |
          uname -a
          cat /etc/os-release
          nproc
          free -m
          df -h / "$RUNNER_TEMP"
          ls -l /dev/kvm
      # GitHub's Linux runners have /dev/kvm, open only to the kvm group.
      - name: enable KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-maki-ci-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: QEMU and seed tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage \
            openssh-client
          qemu-system-x86_64 --version
          qemu-img --version
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: debian12-package
          path: ${{ runner.temp }}/package
      # The image, cached under its pinned name and digest: fetch checks a
      # restored image's digest as it checks a download, and the cache is
      # saved right after a miss, also when a later step fails.
      - name: image cache key
        id: image
        timeout-minutes: 1
        run: python3 -B scripts/booted-host-validation.py image-key --guest "$GUEST" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: image-cache
        timeout-minutes: 10
        with:
          key: ${{ steps.image.outputs.key }}
          path: ${{ runner.temp }}/images
      - name: guest image
        timeout-minutes: 15
        run: python3 -B scripts/booted-host-validation.py fetch --guest "$GUEST" --directory "$RUNNER_TEMP/images"
      - uses: actions/cache/save@v4
        if: steps.image-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        with:
          key: ${{ steps.image.outputs.key }}
          path: ${{ runner.temp }}/images
      - name: guest payload
        timeout-minutes: 5
        run: python3 -B scripts/booted-host-validation.py payload --guest "$GUEST" --suite "$SUITE" --package "$RUNNER_TEMP/package" --output "$RUNNER_TEMP/payload"
      # The boot's deadline, an SSH probe that overruns it, cloud-init's wait
      # given up 90 s after its limit, then the copy: within the step's limit.
      - name: boot the guest
        timeout-minutes: 20
        run: |
          python3 -B scripts/booted-host-validation.py boot --guest "$GUEST" --images "$RUNNER_TEMP/images" --work "$RUNNER_TEMP/guest" --timeout 600
          python3 -B scripts/booted-host-validation.py copy-in --work "$RUNNER_TEMP/guest" --timeout 300 "$RUNNER_TEMP/payload"
      - name: guest facts
        timeout-minutes: 5
        run: python3 -B scripts/booted-host-validation.py run --work "$RUNNER_TEMP/guest" --timeout 180 --root -- python3 -B /var/tmp/maki-ci/booted-host-guest.py facts --guest "$GUEST"
      - name: guest package manager
        timeout-minutes: 10
        run: python3 -B scripts/booted-host-validation.py run --work "$RUNNER_TEMP/guest" --timeout 480 --root -- python3 -B /var/tmp/maki-ci/booted-host-guest.py prepare --guest "$GUEST"
      - name: installation guide and quick start
        if: matrix.suite == 'guides'
        timeout-minutes: 40
        run: python3 -B scripts/booted-host-validation.py run --work "$RUNNER_TEMP/guest" --timeout 2220 --root -- python3 -B /var/tmp/maki-ci/booted-host-guest.py guides --guest "$GUEST"
      - name: privileged runner lifecycle
        if: matrix.suite == 'runner'
        timeout-minutes: 50
        run: python3 -B scripts/booted-host-validation.py run --work "$RUNNER_TEMP/guest" --timeout 2820 --root -- python3 -B /var/tmp/maki-ci/booted-host-guest.py runner --guest "$GUEST"
      - name: guest versions
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python3 -B scripts/booted-host-validation.py run --work "$RUNNER_TEMP/guest" --timeout 180 --root -- python3 -B /var/tmp/maki-ci/booted-host-guest.py versions --guest "$GUEST"
      # The results, the program and its output (not the package), the
      # runner's run directory (not its snapshot or builds), the journal and
      # the guest's console. Neither key (/etc/maki/secrets, the runner's
      # work tree), no backing, no SSH key and no seed is collected.
      - name: collect guest logs
        if: always()
        timeout-minutes: 15
        run: python3 -B scripts/booted-host-validation.py finish --work "$RUNNER_TEMP/guest" --output "$RUNNER_TEMP/guest-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 10
        with:
          name: debian12-guest-${{ matrix.suite }}-logs
          path: ${{ runner.temp }}/guest-logs
          if-no-files-found: ignore
          retention-days: 7

