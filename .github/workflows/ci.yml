# CI strategy per SPEC §55.
# PR: fast, deterministic suites. Nightly: full property/crash/saturation
# gates. Weekly & release tiers (DB qualification, TLS suite, soak, QEMU
# power loss) require dedicated runners — see docs/testing.md.

name: ci

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *" # nightly gates

jobs:
  pr:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install pinned RustSec auditor (Linux)
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: RustSec dependency audit (Linux)
        if: runner.os == 'Linux'
        run: cargo audit --deny warnings
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: native NBD test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nbdkit nbdkit-plugin-dev libnbd-bin dpkg-dev gcc
          nbdkit --version
          nbdinfo --version
          nbdcopy --version
          test -f /usr/include/nbdkit-plugin.h
      # SPEC §55 PR tier: unit, property smoke, codec, fake crypto, journal
      # failpoint smoke, retry/manual-clock, privilege unit, NBD protocol
      # smoke — all part of the default workspace suite. `--locked` keeps
      # the build reproducible against Cargo.lock (third review).
      - name: workspace tests
        run: cargo test --workspace --locked
      - name: pinned plaintext-erasure dependency contract (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -B -m unittest scripts.test_vendor_erasure -v
          python3 -B scripts/check_vendor_erasure.py
      - name: parser erasure and upstream compatibility (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features raw_value
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --release --features raw_value --test maki_raw
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,raw_value --lib
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features arbitrary_precision
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features raw_value,arbitrary_precision
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --release --features arbitrary_precision --test maki_number
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,arbitrary_precision --lib
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,raw_value,arbitrary_precision --lib
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features float_roundtrip
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features raw_value,float_roundtrip
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features arbitrary_precision,float_roundtrip
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --features raw_value,arbitrary_precision,float_roundtrip
          cargo test --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --release --features raw_value,arbitrary_precision,float_roundtrip --test maki_float --test maki_raw --test maki_number --test maki_scratch
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,float_roundtrip --lib
          cargo check --manifest-path vendor/serde_json/Cargo.toml --target-dir target --locked --no-default-features --features alloc,raw_value,arbitrary_precision,float_roundtrip --lib
      - name: TLS erasure and upstream compatibility (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path vendor/rustls/Cargo.toml --target-dir target --locked --no-default-features --features std,ring,tls12 --lib
          cargo test --manifest-path vendor/rustls/Cargo.toml --target-dir target --locked --no-default-features --features std,aws_lc_rs,tls12 --lib
      - name: transport framing erasure and upstream compatibility (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path vendor/bytes/Cargo.toml --target-dir target --locked --features serde
          cargo test --manifest-path vendor/hyper/Cargo.toml --target-dir target --locked --features client,server,http1,http2 --lib
          cargo test --manifest-path vendor/tungstenite/Cargo.toml --target-dir target --locked
      - name: fault campaign oracles (Linux)
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s scripts -p 'test_*validation.py' -v
      - name: Debian package contract (Linux)
        if: runner.os == 'Linux'
        run: python3 -B -m unittest scripts.test_debian_package -v
      - name: release candidate preparation contract (Linux)
        if: runner.os == 'Linux'
        run: python3 -B -m unittest scripts.test_release_preparation -v
      - name: documentation links (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -B -m unittest scripts.test_docs_links -v
          python3 -B scripts/check_docs_links.py

  nightly-gates:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # SPEC §55 nightly tier: full property tests, crash cycles, queue
      # saturation, retry storm — every ignored release gate. No name filter:
      # a filter silently dropped the R3b sweeps, so new gates run by default.
      - name: phase gates (release)
        run: cargo test --workspace --release --locked -- --ignored
      - name: nbdkit plugin build (cdylib + plugin_init symbol)
        run: |
          cargo build --release --locked -p maki-nbdkit
          nm -D target/release/libmaki_nbdkit.so | grep -q plugin_init
      # Third review F08: the hand-mirrored nbdkit_plugin struct and the
      # NBDKIT_* constants are checked against the distribution's header by
      # a C probe (tests/review_abi.rs), not by comments.
      - name: nbdkit ABI check against the installed header
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nbdkit-plugin-dev
          test -f /usr/include/nbdkit-plugin.h
          cargo test --locked -p maki-nbdkit --test review_abi -- --nocapture
      # Review M-008: a release build must not accept the non-cryptographic
      # fake provider. (In `cargo test --workspace` feature unification turns
      # it on for the nbdkit crate's own tests, so this is checked here.)
      - name: release build refuses provider = "fake"
        run: |
          cargo build --release --locked -p maki
          cat > /tmp/fake.toml <<'EOF'
          config_schema_version = 1
          [volume]
          name = "fakevol"
          max_virtual_size = "1MiB"
          [crypto]
          provider = "fake"
          crypto_compatibility_id = "test-profile-v1"
          [crypto.capabilities]
          supported_plaintext_sizes = [4096]
          max_ciphertext_size = 4104
          [backing]
          root = "/tmp/fakevol"
          EOF
          if target/release/maki volume create /tmp/fake.toml; then
            echo "release build accepted provider = fake" >&2; exit 1
          fi
          test ! -e /tmp/fakevol/superblock.a
