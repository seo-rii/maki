# Maki directory layout and permissions (SPEC §8).
d /run/maki      0750 root maki -
d /run/maki-attach 0700 root root -
d /run/maki-control 0750 root maki-admin -
d /var/lib/maki  0750 root maki -
d /etc/maki      0750 root maki -
d /etc/maki/volumes 0750 root maki -
# Root-owned attach parameters read by maki-attach@ (SPEC §6) and the
# secrets systemd loads as credentials (SPEC §9); neither is readable by the
# daemon user.
d /etc/maki/attach  0700 root root -
d /etc/maki/secrets 0700 root root -
