// Reference contract for the Maki gRPC remote crypto transport (SPEC §18).
//
// A vendor service may live at any package/service name — the method paths
// are configured per volume (`encrypt_path` / `decrypt_path`) — but the
// message shapes must match these definitions. Responses MUST echo each
// item's unit_index and preserve request order; Maki validates both.
//
// An error is classified by its gRPC status code; the status message and
// details are ignored. Two failures also need a metadata value: status
// FAILED_PRECONDITION with exactly one `maki-crypto-error` value.
//
//   auth-tag-mismatch             the ciphertext failed authentication
//   context-mismatch              the ciphertext is not bound to this context
//   unsupported-format-version    this format_version is not accepted
//   unsupported-compatibility-id  this compatibility_id is not accepted
//
// The first two are integrity failures. A service that declares integrity
// MUST answer a ciphertext it cannot authenticate with one of them: at attach
// Maki sends a tampered ciphertext and accepts no other answer, neither a
// success nor another status. Without one of these values
// FAILED_PRECONDITION, INVALID_ARGUMENT, NOT_FOUND and OUT_OF_RANGE are
// request errors, RESOURCE_EXHAUSTED is throttling, UNAUTHENTICATED,
// PERMISSION_DENIED and UNIMPLEMENTED mark the endpoint unusable, and every
// other code is retryable (SPEC §18 has the full table).

syntax = "proto3";

package maki;

service CryptoService {
  rpc EncryptBatch(CryptoBatchRequest) returns (CryptoBatchResponse);
  rpc DecryptBatch(CryptoBatchRequest) returns (CryptoBatchResponse);
}

message CryptoItem {
  uint64 unit_index = 1;
  bytes data = 2;
}

message CryptoBatchRequest {
  string volume_id = 1;
  string compatibility_id = 2;
  repeated CryptoItem items = 3;
  // Volume format version. Together with volume_id and compatibility_id this
  // is the crypto context; a provider declaring context binding MUST tie
  // ciphertext to all three (Maki probes each field at attach).
  uint32 format_version = 4;
}

message CryptoBatchResponse {
  repeated CryptoItem items = 1;
}
