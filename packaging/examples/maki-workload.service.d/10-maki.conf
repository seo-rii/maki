# Example drop-in for a workload using volume `pg`. Install it below the real
# workload unit, replace `pg` with the configured Maki volume, and enable both
# that workload and maki-workload@pg.target.

[Unit]
BindsTo=maki-attach@pg.service
After=maki-attach@pg.service
PartOf=maki-workload@pg.target
Conflicts=maki-recover@pg.service

[Service]
# `!` skips only the User=/Group=/SupplementaryGroups= switch, so the gate runs
# as root even when the workload service has User= set. Everything else about
# this unit still applies to it: CapabilityBoundingSet=, PrivateDevices=,
# DevicePolicy= and the namespace settings. The helper performs read-only
# identity verification and opens /dev/<vg>/<lv> to probe the filesystem, so
# the unit must not use PrivateDevices=yes (which hides that node) and its
# device policy must allow reading it.
#
# The gate also opens the mounted volume's root directory and reads
# .maki-sentinel in it. If CapabilityBoundingSet= drops both
# CAP_DAC_READ_SEARCH and CAP_DAC_OVERRIDE, those opens obey the mode bits as
# for any process running as user and group root: a volume root owned by the
# workload user with mode 0700 (or 0750 with the workload's group), or a
# sentinel the workload replaced with one root cannot read, fails the gate
# with EACCES and the workload never starts. Then keep CAP_DAC_READ_SEARCH
# (sufficient on its own) or CAP_DAC_OVERRIDE in the bounding set, or leave
# the volume root readable and searchable by others (for example 0755) with
# the workload's private directory below it.
ExecStartPre=!/usr/bin/maki-attach verify --volume pg

[Install]
RequiredBy=maki-workload@pg.target
