# Example drop-in for a workload using volume `pg`. Install it below the real
# workload unit, replace `pg` with the configured Maki volume, and enable both
# that workload and maki-workload@pg.target.

[Unit]
BindsTo=maki-attach@pg.service
After=maki-attach@pg.service
PartOf=maki-workload@pg.target
Conflicts=maki-recover@pg.service

[Service]
# `!` runs this command with system manager privileges even when the workload
# service has User= set. The helper performs read-only identity verification.
ExecStartPre=!/usr/bin/maki-attach verify --volume pg

[Install]
RequiredBy=maki-workload@pg.target
