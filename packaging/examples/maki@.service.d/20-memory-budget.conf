# Opt-in template. Replace every @...@ with measured decimal byte counts
# before installing as /etc/systemd/system/maki@VOLUME.service.d/20-memory-budget.conf.
# Match max_bytes and required_memlock_bytes in [security.memory_budget].
# This file is not installed or applied automatically.
[Service]
MemoryAccounting=yes
MemoryMax=@MAX_BYTES@
LimitMEMLOCK=@REQUIRED_MEMLOCK_BYTES@
