# Installed as /etc/dnf/protected.d/maki.conf by the maki package.
#
# dnf refuses a transaction that would remove a package named here, or a
# package it requires, before anything is changed. Maki serves mounted
# filesystems; rpm cannot stop a transaction that has started, so without this
# a `dnf remove maki` refused under an attached volume kept Maki and erased
# nbdkit-server, lvm2, xfsprogs and kmod.
#
# To remove Maki: stop the workloads, stop every maki-workload@<volume>.target
# and wait for its units to be inactive, then run `rpm -e maki` (rpm still
# refuses while a volume is attached) and `dnf autoremove` for the
# dependencies nothing else needs. Upgrades and reinstalls are not affected.
maki
