[package]
name = "maki-backing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `fuzzing` builds `maki_backing::fuzzing`, the fuzz harness's way into the
# decoders of this crate's own records (fuzz/harness, target
# backing_records). Only the harness enables it; it adds no dependency.
[features]
fuzzing = []

[dependencies]
thiserror.workspace = true
parking_lot.workspace = true
sha2 = "0.10"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
getrandom = "0.3"
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
rand.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
