[package]
name = "maki-crypto-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
maki-crypto.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
tonic = { version = "0.13", features = ["tls-native-roots"] }
# Probes whether the host trust store has any roots before asking tonic for
# them (tonic refuses an empty store even when a CA is configured).
rustls-native-certs = "0.8"
prost = "0.13"
http-body = "1"
zeroize.workspace = true

[dev-dependencies]
maki-backing.workspace = true
maki-core.workspace = true
maki-format.workspace = true
maki-crypto-local.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rcgen.workspace = true
rustls.workspace = true
