[package]
name = "maki-crypto-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# `tls-trust`: the roots every remote transport trusts.
maki-crypto = { workspace = true, features = ["tls-trust"] }
# The method-path rule configuration validation applies.
maki-format.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# Select tonic's explicit ring fallback when no process-global provider exists.
# Without it rustls infers one, which panics if another dependency enables
# aws-lc alongside our ring backend. No `tls-*-roots` feature: the provider
# hands tonic its roots as trust anchors (tonic's native-root loader refuses
# an empty host store, and its webpki feature pulls the 0.26 webpki-roots line).
tonic = { version = "0.13", features = ["tls-ring"] }
# Preserve typed TLS handshake failures through tonic/hyper error wrappers.
rustls.workspace = true
prost = "0.13"
http-body = "1"
zeroize.workspace = true
# The TCP connector handed to tonic, so its connect timeout also covers the
# TLS handshake (`connect_with_connector`); the same version tonic uses.
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }

[dev-dependencies]
maki-backing.workspace = true
maki-core.workspace = true
maki-format.workspace = true
maki-crypto-local.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
rcgen.workspace = true
# Raw HTTP/2 responses tonic's server would never produce (truncated
# messages); the version tonic already uses.
h2 = "0.4"
http = "1"
bytes = "1"
