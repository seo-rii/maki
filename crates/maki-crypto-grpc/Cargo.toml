[package]
name = "maki-crypto-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
maki-crypto.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# Select tonic's explicit ring fallback when no process-global provider exists.
# Roots alone leave rustls to infer one, which panics if another dependency
# enables aws-lc alongside our ring backend.
tonic = { version = "0.13", features = ["tls-native-roots", "tls-ring"] }
prost = "0.13"
http-body = "1"
zeroize.workspace = true
# The TCP connector handed to tonic, so its connect timeout also covers the
# TLS handshake (`connect_with_connector_lazy`); the same version tonic uses.
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }

[dev-dependencies]
maki-backing.workspace = true
maki-core.workspace = true
maki-format.workspace = true
maki-crypto-local.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rcgen.workspace = true
rustls.workspace = true
