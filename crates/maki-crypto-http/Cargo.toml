[package]
name = "maki-crypto-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `fuzzing` builds `maki_crypto_http::fuzzing`, the fuzz harness's way into
# the provider's reading of a response: the body's bounded accumulation, the
# JSON mappings of one item and of a batch, a raw body and the status
# (fuzz/harness, target http_response). Only the harness enables it; it adds
# no dependency.
[features]
fuzzing = []

[dependencies]
# `tls-trust`: the roots every remote transport trusts.
maki-crypto = { workspace = true, features = ["tls-trust"] }
maki-crypto-local.workspace = true
maki-format.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
reqwest.workspace = true
rustls.workspace = true
base64.workspace = true
zeroize.workspace = true
bytes.workspace = true
hyper = { version = "=1.11.1", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
maki-backing.workspace = true
maki-core.workspace = true
maki-format.workspace = true
futures-util = "0.3"
rand.workspace = true
maki-test-support.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
rcgen.workspace = true
tokio-rustls.workspace = true
log = "0.4"

# O_NONBLOCK so a FIFO at a configured TLS path cannot hang attach.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
