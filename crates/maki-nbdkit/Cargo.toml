[package]
name = "maki-nbdkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
# Development/benchmark provider selectable via `provider = "fake"`.
fake-provider = ["dep:maki-test-support"]

[dependencies]
maki-core.workspace = true
maki-format.workspace = true
maki-crypto.workspace = true
maki-crypto-local.workspace = true
maki-crypto-http.workspace = true
maki-crypto-websocket.workspace = true
maki-crypto-grpc.workspace = true
maki-backing.workspace = true
maki-control.workspace = true
serde_json.workspace = true
async-trait.workspace = true
maki-test-support = { workspace = true, optional = true }
thiserror.workspace = true
parking_lot.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
maki-nbdkit = { path = ".", features = ["fake-provider"] }
tempfile.workspace = true
base64.workspace = true
tokio-tungstenite = "0.26"
futures-util = "0.3"
tonic = "0.12"
prost = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
