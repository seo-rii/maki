[package]
name = "maki-crypto-websocket"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `fuzzing` builds `maki_crypto_websocket::fuzzing`, the fuzz harness's way
# into the connection reader's reading of a message and the provider's
# reading of a response (fuzz/harness, target websocket_response). Only the
# harness enables it; it adds no dependency.
[features]
fuzzing = []

[dependencies]
# `tls-trust`: the roots every remote transport trusts.
maki-crypto = { workspace = true, features = ["tls-trust"] }
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
base64.workspace = true
parking_lot.workspace = true
# Maki supplies its own connector (`maki_crypto::tls_trust` roots), so the
# feature only provides the rustls connector type. Avoid the webpki feature,
# which pulls in the older webpki-roots 0.26 line.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rustls.workspace = true

[dev-dependencies]
maki-backing.workspace = true
maki-core.workspace = true
maki-format.workspace = true
maki-crypto-local.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
rcgen.workspace = true
tokio-rustls.workspace = true
