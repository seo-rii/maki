[package]
name = "maki-crypto-websocket"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
maki-crypto.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
base64.workspace = true
parking_lot.workspace = true
# Maki supplies its own connector with native and bundled roots. Avoid the
# unused fallback feature, which pulls in the older webpki-roots 0.26 line.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rustls.workspace = true
rustls-native-certs = "0.8"
webpki-roots = "1.0.10"

[dev-dependencies]
maki-backing.workspace = true
maki-core.workspace = true
maki-format.workspace = true
maki-crypto-local.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
rcgen.workspace = true
tokio-rustls.workspace = true
