[package]
name = "maki-privileged"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# NOTE: this crate must never depend on maki-crypto / maki-crypto-local —
# the privileged helper is a storage control-plane component with zero
# access to key material (SPEC §6, PRIV-010).

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

# Open-flag constants (O_NOFOLLOW, O_NONBLOCK) for the mount-root hygiene
# of the executor; no crypto dependency (PRIV-010).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
