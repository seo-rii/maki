[package]
name = "maki-witness"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Operator-only gate: launches a disposable three-member etcd quorum from
# MAKI_ETCD_BIN and refuses to skip without it, so it is excluded from the
# unfiltered nightly `-- --ignored` run (see docs/testing.md).
etcd-qualification = []
# `fuzzing` builds `maki_witness::fuzzing`, the fuzz harness's way into the
# readers of what a peer sends: the RPC client's reading of an answer, the
# server's reading of a request and the etcd store's reading of etcd's
# answers (fuzz/harness, targets witness_rpc and witness_etcd). Only the
# harness enables it; it adds no dependency.
fuzzing = []

[dependencies]
maki-backing.workspace = true
maki-crypto.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
uuid.workspace = true
sha2 = "0.10"
base64.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
# `tokio::net::TcpSocket`: a port bound without listening, which refuses
# connections (`tests/failover.rs`).
tokio.workspace = true
