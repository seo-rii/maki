[package]
name = "maki-witness"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Operator-only gate: launches a disposable three-member etcd quorum from
# MAKI_ETCD_BIN and refuses to skip without it, so it is excluded from the
# unfiltered nightly `-- --ignored` run (see docs/testing.md).
etcd-qualification = []

[dependencies]
maki-backing.workspace = true
maki-crypto.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
uuid.workspace = true
sha2 = "0.10"
base64.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
