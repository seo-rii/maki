# Drop-in that registers the Debian PostgreSQL 15 "main" cluster against the
# Maki lifecycle of volume `postgres`.
#
#   install -D -m 0644 10-maki.conf \
#     /etc/systemd/system/postgresql@15-main.service.d/10-maki.conf
#   systemctl daemon-reload
#   systemctl enable postgresql@15-main.service      # installs RequiredBy
#   systemctl enable --now maki-workload@postgres.target
#
# Adjust the unit name for another version or cluster.

[Unit]
BindsTo=maki-attach@postgres.service
After=maki-attach@postgres.service
PartOf=maki-workload@postgres.target
Conflicts=maki-recover@postgres.service

[Service]
# `!` keeps root for this one command while the service itself runs as
# postgres. The helper performs a read-only identity check of the trusted
# attachment record, mount and kernel topology; a failure prevents the start.
ExecStartPre=!/usr/bin/maki-attach verify --volume postgres

[Install]
RequiredBy=maki-workload@postgres.target
